# ==========================================
# 界面主题（v4.1：雾白 · 克制高级 · 浅色）
# 与 main.py 内嵌 CSS 的 :root 变量保持一致
# ==========================================
[theme]
# 主色：靛蓝（按钮、进度条、链接）
primaryColor = "#2563eb"
# 背景：雾白
backgroundColor = "#f7f8fa"
# 次级背景（侧边栏）：近白
secondaryBackgroundColor = "#fbfcfd"
# 文字色：近黑
textColor = "#1a1d21"
font = "sans serif"

[server]
fileWatcherType = "auto"
# 部署云端公网 Demo 时需要关闭跨源保护才能被外部访问
enableCORS = false
enableXsrfProtection = false
