<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Microsoft YaHei, SimHei, sans-serif">
  <defs>
    <marker id="arr6" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5a6f85"/>
    </marker>
    <marker id="arrR6" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect width="1000" height="660" fill="#f8fafc"/>

  <!-- 标题 -->
  <text x="500" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a3a5c">
    组合风险原理：为什么单点看不出、组合才看出
  </text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#5a6f85">
    单点检测把每个技能单独打分 → 风险被摊平成一串「中危 / 高危」；组合分析回答的是「这批技能凑在一起会怎样」
  </text>

  <!-- ================= 左：单点视角 ================= -->
  <text x="60" y="84" font-size="12.5" font-weight="bold" fill="#134b73">① 单点视角：两个各自看起来都正常的技能包</text>

  <rect x="60" y="94" width="270" height="86" rx="8" fill="#ffffff" stroke="#1a6fa8" stroke-width="1.5"/>
  <text x="76" y="116" font-size="12" font-weight="bold" fill="#1a3a5c">Skill A · config-reviewer</text>
  <text x="76" y="135" font-size="10.5" fill="#33475b">功能：检查 .env 命名规范</text>
  <text x="76" y="152" font-size="10.5" fill="#33475b">能力原子：READ_CRED（读凭据）</text>
  <rect x="76" y="160" width="82" height="16" rx="8" fill="#fdf1f0" stroke="#c0392b"/>
  <text x="117" y="172" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#a93226">单点：中危</text>
  <text x="166" y="172" font-size="9.5" fill="#5a6f85">命中 1 处（L6 凭据路径读取）</text>

  <rect x="60" y="192" width="270" height="86" rx="8" fill="#ffffff" stroke="#1e8449" stroke-width="1.5"/>
  <text x="76" y="214" font-size="12" font-weight="bold" fill="#1a3a5c">Skill B · snippet-uploader</text>
  <text x="76" y="233" font-size="10.5" fill="#33475b">功能：把结果同步到云端（粘贴站）</text>
  <text x="76" y="250" font-size="10.5" fill="#33475b">能力原子：EXFIL（向外传输）</text>
  <rect x="76" y="258" width="82" height="16" rx="8" fill="#fdf1f0" stroke="#c0392b"/>
  <text x="117" y="270" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#a93226">单点：高危</text>
  <text x="166" y="270" font-size="9.5" fill="#5a6f85">命中 2 处（L6/L7 外发通道）</text>

  <!-- ================= 中：Agent 边界 ================= -->
  <text x="440" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a3a5c">② Agent 边界</text>

  <rect x="356" y="94" width="168" height="196" rx="10" fill="#eef4fa" stroke="#1a3a5c" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="440" y="114" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a3a5c">同一个 Agent</text>
  <text x="440" y="130" text-anchor="middle" font-size="10" fill="#5a6f85">共享上下文 / 共享工具</text>

  <rect x="370" y="138" width="140" height="40" rx="6" fill="#ffffff" stroke="#1a6fa8"/>
  <text x="440" y="156" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a6fa8">config-reviewer</text>
  <text x="440" y="171" text-anchor="middle" font-size="9.5" fill="#33475b">READ_CRED</text>

  <line x1="396" y1="182" x2="396" y2="202" stroke="#c0392b" stroke-width="2" marker-end="url(#arrR6)"/>
  <text x="404" y="196" font-size="8.5" fill="#c0392b">读结果进入上下文</text>

  <rect x="370" y="206" width="140" height="40" rx="6" fill="#ffffff" stroke="#1e8449"/>
  <text x="440" y="224" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e8449">snippet-uploader</text>
  <text x="440" y="239" text-anchor="middle" font-size="9.5" fill="#33475b">EXFIL</text>

  <text x="440" y="266" text-anchor="middle" font-size="9" fill="#33475b">A 读到的凭据进入共享上下文</text>
  <text x="440" y="281" text-anchor="middle" font-size="9" fill="#33475b">B 发送时把上下文一并打包带走</text>

  <!-- 箭头进入 Agent -->
  <line x1="334" y1="152" x2="366" y2="152" stroke="#5a6f85" stroke-width="2" marker-end="url(#arr6)"/>
  <line x1="334" y1="234" x2="366" y2="234" stroke="#5a6f85" stroke-width="2" marker-end="url(#arr6)"/>

  <!-- ================= 右：组合结论 ================= -->
  <text x="560" y="84" font-size="12.5" font-weight="bold" fill="#a93226">③ 组合视角：成链后的真实后果</text>

  <rect x="560" y="94" width="380" height="184" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="578" y="118" font-size="15" font-weight="bold" fill="#a93226">组合后：凭据被送出 → 严重</text>

  <rect x="578" y="128" width="344" height="58" rx="6" fill="#ffffff" stroke="#e8b4ae"/>
  <text x="590" y="145" font-size="10.5" font-weight="bold" fill="#7d241a">① 能力互补成立</text>
  <text x="590" y="161" font-size="10" fill="#33475b">READ_CRED（A） + EXFIL（B）→ 凑齐 CRED_EXFIL 链路</text>
  <text x="590" y="177" font-size="10" fill="#33475b">A 读到的凭据进入共享上下文，被 B 一并外传</text>

  <rect x="578" y="192" width="344" height="58" rx="6" fill="#ffffff" stroke="#e8b4ae"/>
  <text x="590" y="209" font-size="10.5" font-weight="bold" fill="#7d241a">② 意图闸门放行</text>
  <text x="590" y="225" font-size="10" fill="#33475b">AI 判定 snippet-uploader = SUSPICIOUS（带证据行号）</text>
  <text x="590" y="241" font-size="10" fill="#33475b">③ 外发范围闸门放行：外发范围 = GENERIC（非固定结构）</text>

  <text x="750" y="268" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a93226">→ 建议不安装 · 元凶技能：snippet-uploader</text>

  <!-- ================= 中带：实测结果 ================= -->
  <rect x="60" y="300" width="880" height="92" rx="8" fill="#ffffff" stroke="#c7d3e0"/>
  <text x="78" y="322" font-size="12.5" font-weight="bold" fill="#1a3a5c">实测结果（自建 13 个多技能场景 · 探针按名去重口径）</text>

  <rect x="78" y="332" width="430" height="50" rx="6" fill="#eaf7ef" stroke="#1e8449"/>
  <text x="90" y="350" font-size="10.5" font-weight="bold" fill="#14663c">单点 0 报警实例 · R3 主机信息采集 + 遥测上报</text>
  <text x="90" y="370" font-size="10" fill="#33475b">两个技能 32 条规则 0 命中，组合分析仍检出 2 条 HOSTINFO_EXFIL 链路</text>

  <line x1="518" y1="357" x2="552" y2="357" stroke="#5a6f85" stroke-width="2" marker-end="url(#arr6)"/>

  <rect x="560" y="332" width="362" height="50" rx="6" fill="#fdecea" stroke="#c0392b"/>
  <text x="572" y="350" font-size="10.5" font-weight="bold" fill="#a93226">13 场景组合判定实测</text>
  <text x="572" y="370" font-size="10" fill="#33475b">真链路 6/6 检出 · 假链路 0/7 误报 · 准确率 100%</text>

  <!-- ================= 下方：F4 对照卡 ================= -->
  <rect x="60" y="406" width="880" height="130" rx="8" fill="#f8fafc" stroke="#5a6f85" stroke-width="1.5"/>
  <text x="78" y="428" font-size="12.5" font-weight="bold" fill="#1a3a5c">对照卡 · F4 场景（正规 API 调用 + 读凭据）→ 组合判定「未成链」 ✓ 正确放行</text>

  <rect x="78" y="438" width="410" height="88" rx="6" fill="#ffffff" stroke="#c7d3e0"/>
  <text x="92" y="456" font-size="10.5" font-weight="bold" fill="#1a3a5c">场景构成</text>
  <text x="92" y="472" font-size="10" fill="#33475b">Skill A：exa-search-client（正规 API 调用）</text>
  <text x="92" y="488" font-size="10" fill="#33475b">Skill B：config-reviewer（读 .env 凭据）</text>
  <text x="92" y="504" font-size="10" fill="#33475b">AI 判定：A = BENIGN / STRUCTURED，B = BENIGN / NONE</text>
  <text x="92" y="520" font-size="10" fill="#33475b">场景语料中，A 未提取到 EXFIL 能力原子</text>

  <line x1="498" y1="482" x2="530" y2="482" stroke="#5a6f85" stroke-width="2" marker-end="url(#arr6)"/>

  <rect x="538" y="438" width="384" height="88" rx="6" fill="#eaf7ef" stroke="#1e8449"/>
  <text x="552" y="456" font-size="10.5" font-weight="bold" fill="#14663c">三道闸门各自的作用</text>
  <text x="552" y="472" font-size="10" fill="#33475b">① 能力互补：A 无 EXFIL 能力原子 → 模板凑不齐</text>
  <text x="552" y="488" font-size="10" fill="#33475b">② 意图闸门：两端均判 BENIGN → 不放行</text>
  <text x="552" y="504" font-size="10" fill="#33475b">③ 外发范围闸门：A 的 scope = STRUCTURED，带不走凭据</text>
  <text x="552" y="520" font-size="10" font-weight="bold" fill="#14663c">对照实验：scope 改为 GENERIC 后立即成链</text>

  <text x="78" y="562" font-size="10.5" fill="#5a6f85">→ 由此看出「外发范围闸门」的作用：不是「有通道就成链」，而是「通道能带走什么才成链」；F1–F7 共 7 个假链路场景全部未成链（0/7 误报）。</text>

  <!-- ================= 底部说明 ================= -->
  <text x="500" y="592" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a3a5c">
    单点检测回答「哪个技能有风险」；组合分析回答「这一批技能凑在一起会造成什么后果 —— 该不该装」
  </text>
  <text x="500" y="616" text-anchor="middle" font-size="11" fill="#5a6f85">
    13 个自建多技能场景：真链路 6/6 检出，假链路 0/7 误报（探针按名去重口径 13/13）
  </text>
  <text x="500" y="640" text-anchor="middle" font-size="11" fill="#5a6f85">
    图 6-1　组合风险原理：单点看不出、组合才看出的机理，以及三道闸门各自的作用（F4 假链路过对照）
  </text>
</svg>
