<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 930" width="1000" height="930" font-family="Microsoft YaHei, SimHei, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5a6f85"/>
    </marker>
    <marker id="arrP" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b3fa0"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1e8449"/>
    </marker>
  </defs>

  <rect width="1000" height="930" fill="#f8fafc"/>

  <!-- 标题 -->
  <text x="500" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a3a5c">
    AI 技能组合风险体检站 · 三段式组合分析流水线
  </text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#5a6f85">
    规则定能力（确定性 · 零调用）　|　AI 判意图与外发范围（每条带原文行号）　|　闸门定成链（纯本地推导）
  </text>

  <!-- 右上角定位卡 -->
  <rect x="756" y="66" width="219" height="58" rx="8" fill="#ffffff" stroke="#c7d3e0"/>
  <text x="768" y="88" font-size="11" font-weight="bold" fill="#1a3a5c">AI 技能组合风险体检站</text>
  <text x="768" y="108" font-size="9.5" fill="#5a6f85">回答：该不该装这一批技能</text>

  <!-- ========== 入口 ========== -->
  <rect x="30" y="66" width="690" height="58" rx="8" fill="#ffffff" stroke="#1a3a5c" stroke-width="1.5"/>
  <text x="46" y="90" font-size="12" font-weight="bold" fill="#1a3a5c">① 入口 · 待检技能集（多份 SKILL.md 一起装进同一个 Agent 分析）</text>
  <text x="46" y="110" font-size="10.5" fill="#5a6f85">支持一次上传多个技能包 / 或直接选内置 13 个示例场景（R1–R6 真链路 · F1–F7 假链路）</text>

  <line x1="375" y1="124" x2="375" y2="142" stroke="#5a6f85" stroke-width="2" marker-end="url(#arr)"/>
  <text x="390" y="138" font-size="9.5" fill="#5a6f85">整批技能一起分析</text>

  <!-- ========== 阶段 A · 规则快筛 ========== -->
  <rect x="30" y="146" width="690" height="196" rx="10" fill="#eaf4fb" stroke="#1a6fa8" stroke-width="2"/>
  <text x="46" y="168" font-size="13" font-weight="bold" fill="#134b73">② 阶段 A · 规则快筛（32 条确定性规则 → 8 个能力原子）</text>
  <rect x="536" y="154" width="168" height="20" rx="10" fill="#1a6fa8"/>
  <text x="620" y="168" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">纯离线 · 零模型调用</text>

  <rect x="46" y="176" width="236" height="160" rx="6" fill="#ffffff" stroke="#b8d4ea"/>
  <text x="164" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#134b73">32 条确定性规则</text>
  <line x1="60" y1="208" x2="268" y2="208" stroke="#d8e6f2" stroke-width="1"/>
  <text x="60" y="226" font-size="10" fill="#33475b">30 条正则规则 / 8 类威胁</text>
  <text x="60" y="244" font-size="10" fill="#33475b">+ 1 条隐藏 Unicode 字符通道</text>
  <text x="60" y="262" font-size="10" fill="#33475b">+ 1 条跨行组合规则 = 合计 32 条</text>
  <text x="60" y="284" font-size="10" fill="#33475b">命中项 → 规则名 · 严重度 · 原文行号</text>
  <text x="60" y="306" font-size="10" font-weight="bold" fill="#1a6fa8">↓ 翻译为 8 个能力原子（带行号）</text>

  <line x1="282" y1="256" x2="296" y2="256" stroke="#5a6f85" stroke-width="2" marker-end="url(#arr)"/>
  <text x="289" y="244" text-anchor="middle" font-size="8.5" fill="#5a6f85">翻译</text>

  <rect x="300" y="176" width="404" height="160" rx="6" fill="#ffffff" stroke="#b8d4ea"/>
  <text x="312" y="194" font-size="11" font-weight="bold" fill="#134b73">8 个能力原子 —— 客观「能做什么」的最小单位</text>

  <rect x="312" y="200" width="184" height="28" rx="5" fill="#eaf4fb" stroke="#b8d4ea"/>
  <text x="404" y="213" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a6fa8">READ_CRED</text>
  <text x="404" y="224" text-anchor="middle" font-size="9" fill="#33475b">读凭据</text>
  <rect x="506" y="200" width="184" height="28" rx="5" fill="#eaf4fb" stroke="#b8d4ea"/>
  <text x="598" y="213" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a6fa8">EXFIL</text>
  <text x="598" y="224" text-anchor="middle" font-size="9" fill="#33475b">向外传输</text>

  <rect x="312" y="232" width="184" height="28" rx="5" fill="#eaf4fb" stroke="#b8d4ea"/>
  <text x="404" y="245" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a6fa8">EXEC</text>
  <text x="404" y="256" text-anchor="middle" font-size="9" fill="#33475b">执行命令</text>
  <rect x="506" y="232" width="184" height="28" rx="5" fill="#eaf4fb" stroke="#b8d4ea"/>
  <text x="598" y="245" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a6fa8">EVADE</text>
  <text x="598" y="256" text-anchor="middle" font-size="9" fill="#33475b">规避检测</text>

  <rect x="312" y="264" width="184" height="28" rx="5" fill="#eaf4fb" stroke="#b8d4ea"/>
  <text x="404" y="277" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a6fa8">PERSIST</text>
  <text x="404" y="288" text-anchor="middle" font-size="9" fill="#33475b">长期驻留</text>
  <rect x="506" y="264" width="184" height="28" rx="5" fill="#eaf4fb" stroke="#b8d4ea"/>
  <text x="598" y="277" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a6fa8">CONTROL</text>
  <text x="598" y="288" text-anchor="middle" font-size="9" fill="#33475b">劫持 AI</text>

  <rect x="312" y="296" width="184" height="28" rx="5" fill="#eaf4fb" stroke="#b8d4ea"/>
  <text x="404" y="309" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a6fa8">HOST_INFO</text>
  <text x="404" y="320" text-anchor="middle" font-size="9" fill="#33475b">主机信息</text>
  <rect x="506" y="296" width="184" height="28" rx="5" fill="#eaf4fb" stroke="#b8d4ea"/>
  <text x="598" y="309" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a6fa8">DOWNLOAD</text>
  <text x="598" y="320" text-anchor="middle" font-size="9" fill="#33475b">入站拉取</text>

  <line x1="375" y1="342" x2="375" y2="358" stroke="#5a6f85" stroke-width="2" marker-end="url(#arr)"/>
  <text x="390" y="355" font-size="9.5" fill="#5a6f85">能力原子（带行号）</text>

  <!-- ========== 阶段 B · 可核验 AI 分诊 ========== -->
  <rect x="30" y="362" width="690" height="176" rx="10" fill="#f4ecfa" stroke="#6b3fa0" stroke-width="2"/>
  <text x="46" y="384" font-size="13" font-weight="bold" fill="#4a2a75">③ 阶段 B · 可核验 AI 分诊（华为云 MaaS · 每个技能一次调用）</text>
  <rect x="536" y="370" width="168" height="20" rx="10" fill="#6b3fa0"/>
  <text x="620" y="384" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">每条判断带原文行号</text>

  <rect x="46" y="398" width="320" height="84" rx="6" fill="#ffffff" stroke="#cbb6e0"/>
  <text x="58" y="416" font-size="11" font-weight="bold" fill="#4a2a75">问题一 · 行为意图（想做什么）</text>
  <rect x="60" y="422" width="92" height="30" rx="5" fill="#f4ecfa" stroke="#cbb6e0"/>
  <text x="106" y="435" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#6b3fa0">MALICIOUS</text>
  <text x="106" y="447" text-anchor="middle" font-size="9" fill="#33475b">恶意</text>
  <rect x="159" y="422" width="92" height="30" rx="5" fill="#f4ecfa" stroke="#cbb6e0"/>
  <text x="205" y="435" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#6b3fa0">SUSPICIOUS</text>
  <text x="205" y="447" text-anchor="middle" font-size="9" fill="#33475b">可疑</text>
  <rect x="258" y="422" width="92" height="30" rx="5" fill="#f4ecfa" stroke="#cbb6e0"/>
  <text x="304" y="435" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#6b3fa0">BENIGN</text>
  <text x="304" y="447" text-anchor="middle" font-size="9" fill="#33475b">正常</text>
  <text x="58" y="470" font-size="9.5" fill="#5a6f85">→ 阶段 C 的「意图闸门」输入</text>

  <rect x="384" y="398" width="320" height="84" rx="6" fill="#ffffff" stroke="#cbb6e0"/>
  <text x="396" y="416" font-size="11" font-weight="bold" fill="#4a2a75">问题二 · 外发数据范围（能带走什么）</text>
  <rect x="398" y="422" width="92" height="30" rx="5" fill="#f4ecfa" stroke="#cbb6e0"/>
  <text x="444" y="435" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#6b3fa0">GENERIC</text>
  <text x="444" y="447" text-anchor="middle" font-size="9" fill="#33475b">通用内容</text>
  <rect x="497" y="422" width="92" height="30" rx="5" fill="#f4ecfa" stroke="#cbb6e0"/>
  <text x="543" y="435" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#6b3fa0">STRUCTURED</text>
  <text x="543" y="447" text-anchor="middle" font-size="9" fill="#33475b">固定结构</text>
  <rect x="596" y="422" width="92" height="30" rx="5" fill="#f4ecfa" stroke="#cbb6e0"/>
  <text x="642" y="435" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#6b3fa0">NONE</text>
  <text x="642" y="447" text-anchor="middle" font-size="9" fill="#33475b">无外发</text>
  <text x="396" y="470" font-size="9.5" fill="#5a6f85">→ 阶段 C 的「外发范围闸门」输入</text>

  <rect x="46" y="490" width="658" height="34" rx="5" fill="#ffffff" stroke="#cbb6e0"/>
  <text x="375" y="511" text-anchor="middle" font-size="10.5" fill="#4a2a75">一次调用同时判两个标签 · 证据行增强（±4 行就近吸附）· 分诊失败即 fail-closed 且不写缓存</text>

  <line x1="375" y1="538" x2="375" y2="554" stroke="#5a6f85" stroke-width="2" marker-end="url(#arr)"/>
  <text x="390" y="551" font-size="9.5" fill="#5a6f85">意图 + 外发范围（带行号）</text>

  <!-- ========== 阶段 C · 三要素成链 ========== -->
  <rect x="30" y="558" width="690" height="150" rx="10" fill="#e9f6f7" stroke="#0e7c86" stroke-width="2"/>
  <text x="46" y="580" font-size="13" font-weight="bold" fill="#0a5c63">④ 阶段 C · 三要素成链（纯本地推导 · 无模型参与 · 7 类链路模板）</text>

  <rect x="46" y="592" width="170" height="54" rx="6" fill="#ffffff" stroke="#a8d8dc"/>
  <text x="131" y="612" text-anchor="middle" font-size="12" font-weight="bold" fill="#0a5c63">① 能力互补</text>
  <text x="131" y="630" text-anchor="middle" font-size="9" fill="#33475b">两端凑齐模板所需能力</text>

  <rect x="226" y="592" width="170" height="54" rx="6" fill="#ffffff" stroke="#a8d8dc"/>
  <text x="311" y="612" text-anchor="middle" font-size="12" font-weight="bold" fill="#0a5c63">② 意图闸门</text>
  <text x="311" y="630" text-anchor="middle" font-size="9" fill="#33475b">至少一方 SUSPICIOUS/MALICIOUS</text>

  <rect x="406" y="592" width="170" height="54" rx="6" fill="#ffffff" stroke="#a8d8dc"/>
  <text x="491" y="612" text-anchor="middle" font-size="12" font-weight="bold" fill="#0a5c63">③ 外发范围闸门</text>
  <text x="491" y="630" text-anchor="middle" font-size="9" fill="#33475b">提供 EXFIL 的一方须为 GENERIC</text>

  <line x1="576" y1="619" x2="592" y2="619" stroke="#0e7c86" stroke-width="2" marker-end="url(#arrG)"/>
  <rect x="596" y="592" width="108" height="54" rx="6" fill="#0e7c86"/>
  <text x="650" y="612" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">链路清单</text>
  <text x="650" y="630" text-anchor="middle" font-size="9" fill="#d7f0f2">7 类模板 · 严重度</text>

  <rect x="46" y="658" width="658" height="34" rx="5" fill="#ffffff" stroke="#a8d8dc"/>
  <text x="375" y="679" text-anchor="middle" font-size="10.5" fill="#0a5c63">每条链路记录：两端技能 · 各自提供的能力 · 意图理由 · 外发范围 · 严重度 · 原文行号（可逐条回溯）</text>

  <line x1="375" y1="708" x2="375" y2="724" stroke="#5a6f85" stroke-width="2" marker-end="url(#arr)"/>
  <text x="390" y="721" font-size="9.5" fill="#5a6f85">链路清单</text>

  <!-- ========== 输出 ========== -->
  <rect x="30" y="728" width="945" height="104" rx="10" fill="#eaf7ef" stroke="#1e8449" stroke-width="2"/>
  <text x="46" y="750" font-size="13" font-weight="bold" fill="#14663c">⑤ 输出 · 安装决定报告 —— 终点是一个「决定」，不是一张风险清单</text>

  <rect x="46" y="762" width="150" height="40" rx="6" fill="#ffffff" stroke="#1e8449"/>
  <text x="121" y="780" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e8449">✓ 可安装</text>
  <text x="121" y="795" text-anchor="middle" font-size="9" fill="#33475b">无链路·无失败·无可疑意图</text>

  <rect x="210" y="762" width="270" height="40" rx="6" fill="#fdecea" stroke="#c0392b"/>
  <text x="345" y="780" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">✗ 建议不安装</text>
  <text x="345" y="795" text-anchor="middle" font-size="9" fill="#33475b">列出元凶技能（链路的两个端点）</text>

  <rect x="494" y="762" width="270" height="40" rx="6" fill="#fff8e6" stroke="#b8860b"/>
  <text x="629" y="780" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6116">! 谨慎安装</text>
  <text x="629" y="795" text-anchor="middle" font-size="9" fill="#33475b">存在高危链路，确认业务必要性</text>

  <text x="784" y="778" font-size="10" fill="#14663c">可复算：同一批技能反复体检</text>
  <text x="784" y="795" font-size="10" fill="#14663c">→ 磁盘缓存命中，零模型调用</text>

  <text x="46" y="822" font-size="11.5" fill="#14663c">设计意图：把「风险清单」收敛成「从哪个技能开始排查」的明确行动</text>

  <!-- ========== 红色警示带 ========== -->
  <rect x="30" y="844" width="945" height="34" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <path d="M47 852 L55 866 L39 866 Z" fill="#c0392b"/>
  <text x="518" y="866" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a93226">AI 分诊失败 → fail-closed：绝不输出「可安装」——失败技能过不了意图闸门，且不写入缓存</text>

  <!-- ========== 右侧支线 1 · 三段分工 ========== -->
  <rect x="756" y="146" width="219" height="196" rx="8" fill="#ffffff" stroke="#c7d3e0"/>
  <text x="768" y="166" font-size="12" font-weight="bold" fill="#1a3a5c">三段分工，一句话看懂</text>

  <rect x="766" y="176" width="199" height="46" rx="5" fill="#eaf4fb" stroke="#1a6fa8"/>
  <text x="865" y="194" text-anchor="middle" font-size="11" font-weight="bold" fill="#134b73">规则定能力</text>
  <text x="865" y="211" text-anchor="middle" font-size="9" fill="#33475b">确定性 · 零调用 · 可复现</text>

  <rect x="766" y="228" width="199" height="46" rx="5" fill="#f4ecfa" stroke="#6b3fa0"/>
  <text x="865" y="246" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a2a75">AI 定意图 + 外发范围</text>
  <text x="865" y="263" text-anchor="middle" font-size="9" fill="#33475b">每条判断带原文行号</text>

  <rect x="766" y="280" width="199" height="46" rx="5" fill="#e9f6f7" stroke="#0e7c86"/>
  <text x="865" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#0a5c63">闸门定成链</text>
  <text x="865" y="315" text-anchor="middle" font-size="9" fill="#33475b">三要素缺一不可</text>

  <text x="768" y="336" font-size="9.5" fill="#5a6f85">AI 不是总结工具，而是闸门输入</text>

  <!-- ========== 右侧支线 2 · 判定缓存 ========== -->
  <rect x="756" y="362" width="219" height="176" rx="8" fill="#ffffff" stroke="#6b3fa0" stroke-dasharray="5 3"/>
  <text x="768" y="384" font-size="12" font-weight="bold" fill="#4a2a75">判定缓存支线（零成本复算）</text>
  <text x="768" y="404" font-size="10" font-weight="bold" fill="#33475b">① 先查磁盘缓存</text>
  <text x="768" y="418" font-size="10" fill="#5a6f85">　　命中 → 零调用复算</text>
  <text x="768" y="434" font-size="10" font-weight="bold" fill="#33475b">② 未命中 → 调 MaaS 分诊</text>
  <text x="768" y="448" font-size="10" fill="#5a6f85">　　结果写回缓存（原子写）</text>
  <text x="768" y="464" font-size="10" fill="#5a6f85">正文一变 → 键失效 → 自动重判</text>
  <text x="768" y="480" font-size="10" fill="#5a6f85">并发锁 + 损坏自愈（.bak 留现场）</text>
  <text x="768" y="496" font-size="10" fill="#5a6f85">分诊失败 → 不写缓存（不固化）</text>
  <text x="768" y="514" font-size="10" fill="#5a6f85">失败项在服务恢复后自动重判</text>
  <line x1="722" y1="432" x2="748" y2="432" stroke="#6b3fa0" stroke-width="2" marker-end="url(#arrP)"/>
  <text x="735" y="424" text-anchor="middle" font-size="8.5" fill="#6b3fa0">缓存</text>

  <!-- ========== 右侧支线 3 · 图例 ========== -->
  <rect x="756" y="558" width="219" height="150" rx="8" fill="#ffffff" stroke="#c7d3e0"/>
  <text x="768" y="580" font-size="12" font-weight="bold" fill="#1a3a5c">图例</text>
  <rect x="770" y="592" width="12" height="12" rx="2" fill="#1a6fa8"/>
  <text x="790" y="602" font-size="9.5" fill="#33475b">规则层（确定性 · 零调用）</text>
  <rect x="770" y="614" width="12" height="12" rx="2" fill="#6b3fa0"/>
  <text x="790" y="624" font-size="9.5" fill="#33475b">AI 层（带行号 · 闸门输入）</text>
  <rect x="770" y="636" width="12" height="12" rx="2" fill="#0e7c86"/>
  <text x="790" y="646" font-size="9.5" fill="#33475b">组合判定层（纯本地推导）</text>
  <rect x="770" y="658" width="12" height="12" rx="2" fill="#1e8449"/>
  <text x="790" y="668" font-size="9.5" fill="#33475b">输出（安装决定）</text>
  <rect x="770" y="680" width="12" height="12" rx="2" fill="#c0392b"/>
  <text x="790" y="690" font-size="9.5" fill="#33475b">警示 / fail-closed</text>

  <!-- 底部说明 -->
  <text x="500" y="898" text-anchor="middle" font-size="10.5" fill="#5a6f85">
    三段分工：规则定能力（确定性 · 零调用）　·　AI 定意图与外发范围（带行号）　·　闸门定成链（纯本地推导）
  </text>
